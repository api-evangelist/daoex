aid: daoex
name: DAOex
description: 'DAOex (DAO Exchange, product-branded "Commune") was a web3 community relationship management
  platform positioned as an all-in-one tool for understanding, engaging, and growing DAO and NFT communities.
  Its advertised surface covered member directories bridging on-chain and off-chain data, referral programs
  with unique member/affiliate links, quests, contests and bounties as rewards infrastructure, Discord-native
  engagement and role assignment, and payouts of tokens, NFTs or Discord roles on Ethereum mainnet and
  Polygon via an automatically provisioned Gnosis Safe, with a points-and-CSV fallback for pre-token
  communities. Surfaced as a portfolio company of multicoin-capital. As of the 2026-07-20 enrichment pass
  the company appears DEFUNCT: daoex.app no longer resolves in DNS (NXDOMAIN, no SOA), the site was a
  single-page Webflow marketing site last published 2022-09-22 and last archived 2023-03-21, and no API,
  developer portal, documentation, SDK, package or GitHub organization was ever published.'
